id: p8-fact-invalidates-decision
class: admission-invalidation
origin: authored
existing:
  - alias: e1
    text: "The Decision arm keeps a single predecessor id and never widens supersedes to a list."
    kind: decision
    scope: p
    lifecycle: active
    validity: valid
    created_at: 2025-01-01T00:00:00Z
incoming:
  content: "The Decision arm keeps one predecessor id and never widens supersedes to a list."
  scope: p
  kind: fact
expect:
  material: correction
  step: auto_invalidate
  mutation:
    acceptable:
      - "rows == 2"
      - "e1.validity == invalid"
      - "e1.invalidated_by == incoming reason correction"
why: >-
  A Fact replacement verdict of correction against an in-force Decision
  invalidates it in the same transaction as the Fact insert (P8
  assessor-automatic-exits piece, D13) — the Decision stays in_force with
  no supersession edge, only its validity and the two invalidation columns
  move.
