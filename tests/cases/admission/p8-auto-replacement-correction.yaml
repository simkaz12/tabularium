id: p8-auto-replacement-correction
class: admission-auto-replacement
origin: authored
existing:
  - alias: e1
    text: "Automatic replacement supersedes the predecessor Fact and draws one forward edge."
    kind: fact
    scope: p
    lifecycle: active
    validity: valid
    created_at: 2025-01-01T00:00:00Z
incoming:
  content: "Automatic replacement supersedes the predecessor Fact and draws exactly one forward edge."
  scope: p
  kind: fact
expect:
  material: correction
  step: auto_supersede
  mutation:
    acceptable:
      - "rows == 2"
      - "e1.superseded_by == incoming"
      - "e1.text unchanged"
why: >-
  Same-scope Fact/Fact replacement with the switch on supersedes
  automatically (P8 assessor-automatic-exits piece, D2): the verdict's own
  reason class lands on the predecessor's row, and the predecessor's text
  is never touched (supersession never rewrites the superseded row's
  content). The predecessor's own `supersession_reason == "correction"` is
  pinned directly in `tests/test_auto_exits.py::
  test_auto_replacement_fact_fact_same_scope_supersedes` — `history_says`
  only reads the CALLER's own named `supersedes` list, which this
  automatic-only case never populates, so that check moved rather than
  being forced onto a row it cannot see.
