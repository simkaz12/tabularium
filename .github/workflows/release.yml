name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish TabuMCP
    if: github.repository == 'simkaz12/tabularium'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: v2
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install Node dependencies
        run: npm ci --no-audit
      - name: Type-check TypeScript
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check tag, package.json and server.json versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const pkg = require("./package.json");
            const server = require("./server.json");
            const tag = process.env.TAG.replace(/^v/, "");
            const versions = {
              tag,
              package: pkg.version,
              server: server.version,
              serverPackage: server.packages[0].version,
            };
            console.log(versions);
            if (new Set(Object.values(versions)).size !== 1) {
              console.error("version mismatch");
              process.exit(1);
            }
            if (server.name !== pkg.mcpName) {
              console.error("server.json name differs from package.json mcpName");
              process.exit(1);
            }
          '
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Wait for npm to serve the version
        env:
          TAG: ${{ github.ref_name }}
          POLL_INTERVAL: '15'
        run: |
          VERSION="${TAG#v}"
          for attempt in $(seq 1 60); do
            served="$(npm view "tabumcp@${VERSION}" version 2>/dev/null || true)"
            if [ "$served" = "$VERSION" ]; then
              echo "npm serves tabumcp@${VERSION} after ${attempt} tries"
              exit 0
            fi
            sleep "$POLL_INTERVAL"
          done
          echo "npm has not served tabumcp@${VERSION} after 15 minutes. npm may be holding it as a staged publish: approve it on npmjs.com, then publish to the registry by hand from v2/ with mcp-publisher login github and mcp-publisher publish."
          exit 1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          cd "$RUNNER_TEMP"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Log in to the MCP Registry
        run: $RUNNER_TEMP/mcp-publisher login github-oidc
      - name: Publish to the MCP Registry
        run: $RUNNER_TEMP/mcp-publisher publish
